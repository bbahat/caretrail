<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareTrail Screening Passport</title>
<meta name="description" content="CareTrail: a family screening passport and program view for Abu Dhabi's IFHAS and Well-Child programs. Prototype on synthetic data.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2210%22%20fill%3D%22%230b5d57%22%2F%3E%3Ccircle%20cx%3D%2210%22%20cy%3D%2229%22%20r%3D%224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2220%22%20r%3D%224%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2230%22%20cy%3D%2211%22%20r%3D%225%22%20fill%3D%22%23e0a53e%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #eaf0ee;
  --surface: #ffffff;
  --surface-2: #f4f8f7;
  --ink: #10292b;
  --ink-2: #3f5557;
  --muted: #627675;
  --line: #d3dfdc;
  --brand: #0b5d57;
  --brand-ink: #ffffff;
  --brand-soft: #d9ece8;
  --accent: #b7791f;
  --t1: #d03b3b;
  --t2: #ec835a;
  --t3: #e09a00;
  --t4: #2a78d6;
  --ok: #0ca30c;
  --bar: #2a78d6;
  --bar-em: #0b5d57;
  --shadow: 0 1px 2px rgb(16 41 43 / 6%), 0 6px 20px rgb(16 41 43 / 6%);
  --radius: 14px;
  --font: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d1514; --surface: #16201f; --surface-2: #1c2826; --ink: #e6efed; --ink-2: #b9c8c5; --muted: #8ea19e;
    --line: #2a3836; --brand: #45bfae; --brand-ink: #062320; --brand-soft: #173a36; --accent: #e0a53e;
    --t1: #e05555; --t2: #ec835a; --t3: #fab219; --t4: #3987e5; --ok: #0ca30c; --bar: #3987e5; --bar-em: #45bfae;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 24px rgb(0 0 0 / 25%);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1514; --surface: #16201f; --surface-2: #1c2826; --ink: #e6efed; --ink-2: #b9c8c5; --muted: #8ea19e;
  --line: #2a3836; --brand: #45bfae; --brand-ink: #062320; --brand-soft: #173a36; --accent: #e0a53e;
  --t1: #e05555; --t2: #ec835a; --t3: #fab219; --t4: #3987e5; --ok: #0ca30c; --bar: #3987e5; --bar-em: #45bfae;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 24px rgb(0 0 0 / 25%);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
h2 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 1.02rem; font-weight: 650; }
h4 { font-size: 0.86rem; font-weight: 650; color: var(--ink-2); }
p { margin: 0.35rem 0; }
.muted { color: var(--muted); }
.small { font-size: 0.84rem; }
.mono { font-family: var(--mono); font-size: 0.82em; }
svg { flex: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px clamp(16px, 3vw, 32px); background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--brand); }
.brand .mark { width: 38px; height: 38px; }
.brand .name { font-weight: 700; font-size: 1.15rem; color: var(--ink); letter-spacing: -0.01em; }
.brand .tag { font-size: 0.78rem; color: var(--muted); }
.views { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; border: 1px solid var(--line); margin-inline: auto; }
.seg { border: 0; background: none; padding: 7px 14px; border-radius: 999px; cursor: pointer; color: var(--ink-2); font-weight: 550; }
.seg.on { background: var(--brand); color: var(--brand-ink); }
.right { display: flex; align-items: center; gap: 10px; }
.badge-syn { font-size: 0.76rem; color: var(--ink-2); border: 1px dashed var(--line); padding: 4px 10px; border-radius: 999px; }
.lang { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; }

main { padding: clamp(16px, 3vw, 32px); max-width: 1240px; margin: 0 auto; }
.foot { text-align: center; font-size: 0.78rem; color: var(--muted); padding: 8px 16px 32px; max-width: 760px; margin: 0 auto; }

/* family */
.family-wrap { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 300px); gap: 32px; justify-content: center; align-items: start; }
.phone { background: var(--surface); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; }
.fam-bar { padding: 14px 18px 0; }
.fam-pick { display: grid; gap: 2px; }
.fam-pick select { width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.tabs { display: flex; gap: 2px; padding: 12px 12px 0; border-bottom: 1px solid var(--line); }
.tab { flex: 1; border: 0; background: none; padding: 10px 6px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; }
.tab.on { color: var(--ink); border-bottom-color: var(--brand); }
.screen { padding: 18px; display: grid; gap: 12px; }
.hello { font-size: 1.3rem; font-weight: 700; margin: 0; }
.try { position: sticky; top: 90px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.try ol { padding-inline-start: 1.2rem; margin: 10px 0; display: grid; gap: 8px; font-size: 0.9rem; }

/* the family stamp row */
.stamps { display: flex; gap: 6px; overflow-x: auto; padding: 8px 2px 4px; position: relative; scrollbar-width: thin; }
.stamps::before { content: ""; position: absolute; top: 38px; inset-inline: 30px; border-top: 2px dashed var(--line); z-index: 0; }
.stamp { flex: 0 0 76px; display: grid; justify-items: center; gap: 2px; border: 0; background: none; cursor: pointer; padding: 0; position: relative; z-index: 1; }
.stamp .ring { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 3px solid var(--c, var(--line)); position: relative; }
.stamp .init { font-size: 1.35rem; font-weight: 700; color: var(--ink); }
.stamp .dot { position: absolute; bottom: -4px; inset-inline-end: -4px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--c, var(--muted)); }
.stamp .dot svg { width: 18px; height: 18px; }
.stamp .sn { font-weight: 650; font-size: 0.86rem; margin-top: 4px; }
.stamp .sr { font-size: 0.72rem; color: var(--muted); text-align: center; line-height: 1.2; }
.t1 { --c: var(--t1); } .t2 { --c: var(--t2); } .t3 { --c: var(--t3); } .t4 { --c: var(--t4); } .t5 { --c: var(--muted); } .ok { --c: var(--ok); } .neutral { --c: var(--muted); }

.steps-title { margin-top: 8px; }
.steps { display: grid; gap: 12px; }
.step { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 6px; }
.step.t1 { background: color-mix(in srgb, var(--t1) 7%, var(--surface)); border-color: color-mix(in srgb, var(--t1) 35%, var(--line)); }
.step-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.who { font-size: 0.84rem; font-weight: 650; color: var(--ink-2); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 650; color: var(--ink); white-space: nowrap; }
.badge svg { width: 15px; height: 15px; color: var(--c); }
.reason { color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.74rem; padding: 3px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); }
.chip.clinical { border-color: var(--brand); color: var(--brand); font-weight: 600; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.acts.end { justify-content: flex-end; margin-top: 16px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.link { border: 0; background: none; color: var(--brand); padding-inline: 4px; text-decoration: underline; text-underline-offset: 3px; }
.btn.small { padding: 5px 10px; font-size: 0.82rem; }
.btn.block { width: 100%; text-align: start; padding: 12px 14px; }
.btn.more { justify-self: center; }
.booked { display: flex; gap: 8px; align-items: center; color: var(--ink); font-weight: 600; font-size: 0.88rem; }
.booked svg { width: 16px; height: 16px; color: var(--ok); }
.why { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; display: grid; gap: 10px; }
.why ul { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.factors li { display: flex; gap: 8px; align-items: baseline; font-size: 0.9rem; }
.cat { font-size: 0.7rem; font-weight: 650; color: var(--brand); background: var(--brand-soft); padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
.comps li { font-size: 0.86rem; padding-inline-start: 14px; position: relative; }
.comps li::before { content: ""; position: absolute; inset-inline-start: 2px; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: var(--brand); }
.src { font-size: 0.84rem; color: var(--ink-2); }
.clin, .purpose { display: flex; gap: 8px; font-size: 0.86rem; background: var(--brand-soft); padding: 10px; border-radius: 10px; color: var(--ink); }
.clin svg, .purpose svg { width: 16px; height: 16px; color: var(--brand); margin-top: 2px; }
.note { display: flex; gap: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; font-size: 0.9rem; }
.note svg { width: 18px; height: 18px; color: var(--brand); margin-top: 2px; }
.well { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.well-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.well-stats div { display: grid; background: var(--surface-2); border-radius: 10px; padding: 8px; text-align: center; }
.well-stats b { font-size: 1.2rem; }
.well-stats span { font-size: 0.74rem; color: var(--muted); }

/* passport */
.member { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 8px; scroll-margin-top: 90px; }
.member header { display: flex; gap: 10px; align-items: center; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 700; }
.grp { margin-top: 4px; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 128px 1fr; gap: 10px; align-items: start; font-size: 0.9rem; }
.prow > div { display: grid; }
.prow .badge { white-space: normal; }
.trail ol { list-style: none; display: grid; grid-template-columns: repeat(14, 1fr); padding: 0; margin: 10px 0 4px; position: relative; }
.trail ol::before { content: ""; position: absolute; top: 7px; inset-inline: 7px; border-top: 2px solid var(--line); }
.trail li { display: grid; justify-items: center; gap: 4px; position: relative; }
.pip { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.att .pip { background: var(--brand); border-color: var(--brand); }
.miss .pip { border-color: var(--t1); border-style: dashed; }
.now .pip { border-color: var(--t3); border-width: 4px; }
.lab { font-size: 0.6rem; color: var(--muted); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.74rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-inline-end: 5px; vertical-align: -1px; border: 2px solid var(--line); }
.legend .att::before { background: var(--brand); border-color: var(--brand); }
.legend .miss::before { border-color: var(--t1); border-style: dashed; }
.legend .now::before { border-color: var(--t3); border-width: 3px; }

/* consent */
.tog { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; position: relative; }
.tog .tl { display: grid; }
.tog input { position: absolute; opacity: 0; inset-inline-end: 0; width: 44px; height: 26px; margin: 0; cursor: pointer; }
.sw { width: 44px; height: 26px; border-radius: 999px; background: var(--line); position: relative; transition: background 0.15s; }
.sw::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / 25%); transition: inset-inline-start 0.15s; }
.tog input:checked + .sw { background: var(--brand); }
.tog input:checked + .sw::after { inset-inline-start: 21px; }
.tog input:focus-visible + .sw { outline: 3px solid var(--accent); outline-offset: 2px; }
.tog.dis { cursor: default; opacity: 0.7; }

/* log */
.log { display: grid; gap: 8px; }
.cp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 4px 0; }
.cp div { background: var(--surface-2); border-radius: 10px; padding: 8px; min-width: 0; }
.cp dt { font-size: 0.72rem; color: var(--muted); }
.cp dd { margin: 0; overflow-wrap: anywhere; }
.vres { display: flex; gap: 8px; padding: 10px; border-radius: 10px; font-size: 0.88rem; background: var(--surface-2); }
.vres svg { width: 18px; height: 18px; margin-top: 1px; }
.vres.ok { background: color-mix(in srgb, var(--ok) 12%, var(--surface)); }
.vres.ok svg { color: var(--ok); }
.vres.bad { background: color-mix(in srgb, var(--t1) 12%, var(--surface)); }
.vres.bad svg { color: var(--t1); }
.entries { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.entries li { display: grid; gap: 1px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 0.9rem; }
.entries li.edited { border-color: var(--t1); border-style: dashed; }
.eh { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.76rem; color: var(--ink-2); }

/* program */
.program { display: grid; gap: 20px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 2px; }
.kpi b { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.kpi span { font-weight: 600; }
.kpi small { color: var(--muted); }
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.chart { width: 100%; height: auto; font-family: var(--font); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 10px; }
.chart .lab { fill: var(--ink-2); font-size: 11.5px; }
.chart .val { fill: var(--ink); font-size: 11px; font-weight: 600; }
.chart .bar { fill: var(--bar); }
.chart .bar.met, .chart .bar.em { fill: var(--bar-em); }
.chart .target { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 4 3; }
.chart .diag { stroke: var(--muted); stroke-dasharray: 4 4; }
.chart .line { fill: none; stroke: var(--bar); stroke-width: 2; }
.chart .pt { fill: var(--bar); stroke: var(--surface); stroke-width: 2; }
.chart .hov:hover .bar { opacity: 0.85; }
.wchart { min-width: 640px; }
.calwrap { max-width: 340px; }
.mc { display: grid; gap: 6px; margin: 0; }
.mc div { display: grid; grid-template-columns: 150px 1fr; gap: 8px; font-size: 0.88rem; }
.mc dt { color: var(--muted); }
.mc dd { margin: 0; }
.drivers { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.drivers li { display: grid; grid-template-columns: minmax(0, 1fr) 90px 48px; gap: 8px; align-items: center; font-size: 0.86rem; }
.dbar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.dbar i { display: block; height: 100%; border-radius: 4px; }
.dbar i.up { background: var(--t2); }
.dbar i.down { background: var(--bar); }
.tscroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th { text-align: start; font-size: 0.76rem; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th.n, td.n { text-align: end; font-variant-numeric: tabular-nums; }
.assume { margin: 0; padding-inline-start: 1.1rem; display: grid; gap: 4px; font-size: 0.88rem; color: var(--ink-2); }

/* how */
.how { max-width: 900px; margin: 0 auto; display: grid; gap: 14px; }
.hgrid { display: grid; gap: 14px; margin: 10px 0; }
.hsplit { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.hbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; position: relative; }
.hn { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); font-weight: 700; margin-bottom: 8px; }

/* modal, toast, tip */
.scrim { position: fixed; inset: 0; background: rgb(8 20 20 / 45%); z-index: 20; }
.modal { position: fixed; z-index: 21; inset-inline: 16px; top: 50%; transform: translateY(-50%); max-width: 440px; margin: 0 auto; background: var(--surface); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); max-height: 90vh; overflow: auto; }
.slots, .opts { display: grid; gap: 8px; margin-top: 8px; }
.slot { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.slot:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.slot input { accent-color: var(--brand); }
.toast { position: fixed; bottom: 20px; inset-inline: 16px; max-width: 460px; margin: 0 auto; background: var(--ink); color: var(--surface); padding: 12px 16px; border-radius: 12px; z-index: 30; font-size: 0.9rem; box-shadow: var(--shadow); }
.tip { position: fixed; z-index: 40; background: var(--ink); color: var(--surface); font-size: 0.8rem; padding: 6px 10px; border-radius: 8px; pointer-events: none; max-width: 280px; }

@media (max-width: 900px) {
  .family-wrap { grid-template-columns: minmax(0, 1fr); }
  .try { position: static; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pgrid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  main { padding: 12px 0; }
  .phone { border-radius: 0; border-inline: 0; }
  .try, .program, .how { margin-inline: 16px; }
  .views { margin-inline: 0; order: 3; width: 100%; justify-content: space-between; }
  .seg { padding: 7px 10px; font-size: 0.86rem; }
  .badge-syn { display: none; }
  .right { margin-inline-start: auto; }
  .hsplit { grid-template-columns: 1fr; }
  .cp { grid-template-columns: 1fr; }
  .prow { grid-template-columns: 1fr; gap: 2px; }
  .mc div { grid-template-columns: 1fr; gap: 0; }
  .kpi b { font-size: 1.6rem; }
  .drivers li { grid-template-columns: minmax(0, 1fr) 60px; }
  .drivers li .small { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

</style>
</head>
<body>
<div id="app"></div>
<noscript>CareTrail needs JavaScript.</noscript>

function lungHighRisk(p) {

function entryText(e) {
  const who = (id) => {
    const p = state.households.flatMap((h) => h.members).find((m) => m.id === id);
    return p ? nm(p.display_name) : id;
  };
  const what = e.key ? pkgShort(e.key, state.lang) : "";
  const consentName = { genomic: t("c_genomic"), wearables: t("c_wearables"), share_with_household: t("c_share") }[e.consent] || "";
  let action = "";
  switch (e.action) {
    case "result_received": action = a("result_received", { facility: state.lang === "ar" ? "مختبر الشبكة" : "network laboratory" }); break;
    case "referral_created": action = a("referral_created", { to: state.lang === "ar" ? "عيادة النمو العصبي" : "neurodevelopment clinic" }); break;
    case "program_view": action = a("program_view"); break;
    case "declined": action = a("declined", { what }); break;
    case "computed": action = a("computed"); break;
    case "consent": action = a("consent", { what: consentName, state: e.value ? t("on") : t("off") }); break;
    case "booking": action = a("booking", { what }); break;
    case "snoozed": action = a("snoozed", { what }); break;
    case "pseud_open": action = a("pseud_open", { p: e.subject }); break;
  }
  const actor = e.actor.startsWith("person:") ? who(e.actor.slice(7)) : a(e.actor);
  const purpose = e.purpose.startsWith("purpose_") && STR.en[e.purpose] ? t(e.purpose) : a(e.purpose);
  const subj = e.subject && !e.subject.startsWith("P-") ? who(e.subject) : null;
  return { action, actor, purpose, subj };
}

function stamps(hh, res) {
  return `<div class="stamps" role="list">${res.members.map((m) => {
    const p = m.person;
    const priv = isPrivate(p, hh);
    const tiers = priv ? [] : m.items.filter((i) => i.tier && i.tier <= 4 && !state.snoozed[i.id]).map((i) => i.tier);
    const best = tiers.length ? Math.min(...tiers) : null;
    const notCov = !priv && !best && m.items.length > 0 && m.items.every((i) => i.status === "not_eligible");
    const cls = priv || notCov ? "neutral" : best ? `t${best}` : "ok";
    const label = priv ? t("status.info") : notCov ? t("status.not_eligible") : best ? t(`tier.${best}`) : t("up_to_date");
    return `<button class="stamp ${cls}" role="listitem" data-act="member" data-id="${p.id}" aria-label="${esc(nm(p.display_name))}: ${esc(label)}">
      <span class="ring"><span class="init">${esc(nm(p.display_name)).slice(0, 1)}</span><span class="dot">${priv ? ICON.lock : notCov ? ICON.info : best ? ICON[best] : ICON.ok}</span></span>
      <span class="sn">${esc(nm(p.display_name))}</span><span class="sr">${t(`role.${roleOf(p)}`)} · ${ageLabel(p)}</span>
    </button>`;
  }).join("")}</div>`;
}

function visitTrail(p) {
  const sched = RULES.wcv.schedule_months;
  const m = (new Date(REF) - new Date(p.birth_date)) / 864e5 / 30.44;
  const attended = new Set(p.wcv?.attended_months || []);
  const current = Math.max(...sched.filter((x) => x <= m));
  return `<div class="trail" aria-label="${t("visit_trail")}">
    <h4>${t("visit_trail")}</h4>
    <ol>${sched.map((x) => {
      const st = attended.has(x) ? "att" : x < current ? "miss" : x === current ? "now" : "fut";
      const lab = x < 24 || x % 12 ? t("months_short", { n: x }) : t("years_short", { n: x / 12 });
      const name = { att: t("attended"), miss: t("missed"), now: t("due_now"), fut: t("upcoming") }[st];
      return `<li class="${st}" title="${esc(lab)}: ${esc(name)}"><span class="pip"></span><span class="lab">${lab}</span></li>`;
    }).join("")}</ol>
    <div class="legend"><span class="att">${t("attended")}</span><span class="miss">${t("missed")}</span><span class="now">${t("due_now")}</span><span class="fut">${t("upcoming")}</span></div>
  </div>`;
}

    if (isPrivate(p, hh)) return `<section class="member" id="m-${p.id}">${head}<p class="muted">${ICON.lock} ${t("private_body", { name: esc(nm(p.display_name)) })}</p></section>`;
    const groups = [
      [t("needs_action"), m.items.filter((i) => i.tier && i.tier <= 4)],
      [t("tier.5"), m.items.filter((i) => i.tier === 5)],

}

}

function privacy(hh) {

    ? ["افتح «لماذا؟» على متابعة خالد المفتوحة: السبب والمصدر ومن يقرر.", "في «الخصوصية» أوقف بيانات الجهاز لمريم: تتغير الأسباب فورًا.", "في «سجل البيانات» اضغط «تحقق من السجل»، ثم «محاكاة التلاعب» وتحقق مرة أخرى.", "جرّب عائلة خان: إحالة توحد عالقة وعائلة خارج ثقة.", "افتح «لوحة البرنامج» وافتح سجلًا من قائمة التواصل: يظهر في السجل."]
    : ["Open “Why this?” on Khalid's open follow-up: reason, source, and who decides.", "In Privacy, switch off Mariam's wearable data: the reasons update at once.", "In Data log, press Verify log, then Simulate tampering and verify again.", "Try the Khan family: a stuck autism referral and adults outside Thiqa.", "Open the Program view and open a record from the outreach queue: it lands in the log."];
  return `<aside class="try"><h3>${state.lang === "ar" ? "جرّبه في دقيقتين" : "Try it in two minutes"}</h3><ol>${steps.map((s) => `<li>${s}</li>`).join("")}</ol>
  <p class="muted small">${state.lang === "ar" ? "تاريخ المرجع" : "Reference date"}: ${fmtDate(REF)}</p></aside>`;
}

function familyView() {
  const hh = household();
  const res = evaluateHousehold(hh, RULES, REF);
  res.actions.forEach((i) => (i.person = res.members.find((m) => m.person.id === i.personId).person));
  if (!state.computedFor.has(hh.id)) {
    state.computedFor.add(hh.id);
    log({ hh: hh.id, subject: null, actor: "actor_app", action: "computed", purpose: "purpose_compute", data: [...new Set(res.members.flatMap((m) => m.dataUsed))] }).then(render);
  }
  const tab = (id, label) => `<button role="tab" class="tab ${state.tab === id ? "on" : ""}" aria-selected="${state.tab === id}" data-act="tab" data-v="${id}">${label}</button>`;
  const body = state.tab === "steps" ? familySteps(hh, res) : state.tab === "passport" ? passport(hh, res) : state.tab === "privacy" ? privacy(hh) : logPanel(hh.id, (e) => e.hh === hh.id, t("log_title"));
  return `<div class="family-wrap">
    <div class="phone">
      <div class="fam-bar">
        <label class="fam-pick"><span class="muted small">${t("demo_family")}</span>
          <select data-act="family">${state.households.map((h) => `<option value="${h.id}" ${h.id === hh.id ? "selected" : ""}>${esc(nm(h.label))} · ${t(`insurance.${h.insurance}`)} · ${t(`region.${h.region}`)}</option>`).join("")}</select>
        </label>
      </div>
      <div class="tabs" role="tablist">${tab("steps", t("tab_steps"))}${tab("passport", t("tab_passport"))}${tab("privacy", t("tab_privacy"))}${tab("log", t("tab_log"))}</div>
      <div class="screen">${body}</div>
    </div>
    ${tryPanel()}
  </div>`;
}

// ---------------------------------------------------------------- program view

function barsChart(rows, { max = 100, target = null, fmt = (v) => `${v}%`, tip, W = 560, labW = 168 }) {
  const rowH = 26, padR = 52, H = rows.length * rowH + 22;
  const x = (v) => labW + (v / max) * (W - labW - padR);
  const rtl = state.lang === "ar";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" style="direction:ltr">
    ${[0, 0.25, 0.5, 0.75, 1].map((f) => f * max).map((g) => `<line x1="${x(g)}" x2="${x(g)}" y1="0" y2="${H - 18}" class="grid"/><text x="${x(g)}" y="${H - 4}" class="axis" text-anchor="middle">${g}</text>`).join("")}
    ${rows.map((r, i) => {
      const y = i * rowH + 4;
      return `<g class="hov" data-tip="${esc(tip(r))}">
        <rect x="0" y="${y - 2}" width="${W}" height="${rowH}" fill="transparent"/>
        <text x="${labW - 10}" y="${y + 14}" class="lab" text-anchor="end" ${rtl ? 'direction="rtl"' : ""}>${esc(r.label)}</text>
        <rect x="${labW}" y="${y + 4}" width="${Math.max(2, x(r.value) - labW)}" height="14" rx="4" class="bar ${r.cls || ""}"/>
        <text x="${x(r.value) + 6}" y="${y + 15}" class="val">${esc(fmt(r.value))}</text>
      </g>`;
    }).join("")}
    ${target != null ? `<line x1="${x(target)}" x2="${x(target)}" y1="0" y2="${H - 18}" class="target"/>` : ""}
  </svg>`;
}

function calChart(cal) {
  const W = 300, H = 230, p = 36;
  const sx = (v) => p + v * (W - p - 10), sy = (v) => H - p - v * (H - p - 10);
  const pts = cal.filter((c) => c.observed != null);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("m_cal")}" style="direction:ltr">
    ${[0, 0.25, 0.5, 0.75, 1].map((g) => `<line x1="${sx(g)}" x2="${sx(g)}" y1="${sy(0)}" y2="${sy(1)}" class="grid"/><line x1="${sx(0)}" x2="${sx(1)}" y1="${sy(g)}" y2="${sy(g)}" class="grid"/><text x="${sx(g)}" y="${H - p + 16}" class="axis" text-anchor="middle">${g}</text><text x="${p - 6}" y="${sy(g) + 4}" class="axis" text-anchor="end">${g}</text>`).join("")}
    <line x1="${sx(0)}" y1="${sy(0)}" x2="${sx(1)}" y2="${sy(1)}" class="diag"/>
    <polyline points="${pts.map((c) => `${sx(c.mean_predicted)},${sy(c.observed)}`).join(" ")}" class="line"/>
    ${pts.map((c) => `<circle cx="${sx(c.mean_predicted)}" cy="${sy(c.observed)}" r="5" class="pt hov" data-tip="${esc(`${t("m_pred")} ${c.mean_predicted} · ${t("m_obs")} ${c.observed} · n=${c.n}`)}"/>`).join("")}
    <text x="${sx(0.5)}" y="${H - 2}" class="axis" text-anchor="middle">${t("m_pred")}</text>
    <text x="10" y="${sy(0.5)}" class="axis" text-anchor="middle" transform="rotate(-90 10 ${sy(0.5)})">${t("m_obs")}</text>
  </svg>`;
}

function programView() {
  const D = DASH;
  const major = D.kpis.ifhas.find((k) => k.package === "major");
  const refRows = D.kpis.ifhas.filter((k) => k.referral_on_time_pct != null && k.abnormal_n >= D.meta.min_cell);
  const refOn = Math.round(refRows.reduce((s, k) => s + k.referral_on_time_pct * k.abnormal_n, 0) / refRows.reduce((s, k) => s + k.abnormal_n, 0) * 10) / 10;
  const kpi = (v, l, d, cls = "") => `<div class="kpi ${cls}"><b>${v}</b><span>${l}</span>${d ? `<small>${d}</small>` : ""}</div>`;
  const partRows = D.kpis.ifhas.filter((k) => k.eligible >= D.meta.min_cell).map((k) => ({
    label: pkgShort(k.package, state.lang), value: k.participation_pct, n: k.eligible, cls: k.participation_pct >= k.target_pct ? "met" : "",
  }));
  const sim = D.simulation;
  const tierOnly = sim.find((s) => s.policy.startsWith("Clinical tier"));
  const ct = sim.find((s) => s.policy === "CareTrail prioritisation");
  const coefs = D.model.coefficients.slice(0, 8);
  const cmax = Math.max(...coefs.map((c) => Math.abs(c.coef)));
  const segs = D.safeguards;
  const q = D.queue;

  return `<div class="program">
    <section class="p-head"><h2>${t("p_title")}</h2><p class="muted">${t("p_sub", { people: num(D.meta.people), hh: num(D.meta.households), date: fmtDate(D.meta.reference_date) })}</p></section>
    <section class="kpis">
      ${kpi(num(D.care_gaps.people_with_gaps), t("k_gaps"), "")}
      ${kpi(num(D.care_gaps.people_with_open_loops), t("k_open"), t("k_open_d"), "warn")}
      ${kpi(`${num(major.participation_pct)}%`, t("k_part"), t("k_part_d", { t: major.target_pct }))}
      ${kpi(`${num(refOn)}%`, t("k_ref"), t("k_ref_d", { t: 100 }), "warn")}
    </section>
    <div class="pgrid">
      <section class="card wide"><h3>${t("c_part_title")}</h3><p class="muted small">${t("c_part_sub", { t: major.target_pct })}</p>
        <div class="tscroll"><div class="wchart">${barsChart(partRows, { target: major.target_pct, tip: (r) => `${r.label}: ${r.value}% · ${t("eligible_n", { n: num(r.n) })}</div></div>`, W: 1100, labW: 190 })}
      </section>
      <section class="card"><h3>${t("c_sim_title")}</h3><p class="muted small">${t("c_sim_sub", { n: num(ct.contacted) })}</p>
        ${barsChart(sim.map((s) => ({ label: t(`policy.${s.policy}`), value: s.expected_open_loops_closed, cls: s.policy === "CareTrail prioritisation" ? "em" : "", s })), { max: 400, W: 560, labW: 230, fmt: (v) => num(v), tip: (r) => `${r.label}: ${num(r.value)} · ${state.lang === "ar" ? "فحوص مكتملة" : "completions"} ${num(r.s.expected_completions)}` })}
        <p class="small">${t("c_sim_note", { a: num(tierOnly.open_loops_gain_vs_broad), b: num(ct.expected_completions - tierOnly.expected_completions) })}</p>
      </section>
      <section class="card"><h3>${t("m_title")}</h3><p class="purpose">${ICON.info}<span>${t("m_purpose")}</span></p>
        <dl class="mc">
          <div><dt>${t("m_type")}</dt><dd>${state.lang === "ar" ? "انحدار لوجستي بمتغيرات معيارية" : esc(D.model.type)}</dd></div>
          <div><dt>${t("m_target")}</dt><dd>${state.lang === "ar" ? "عدم إكمال الفحص خلال 90 يومًا من الدعوة" : esc(D.model.target)}</dd></div>
          <div><dt>${t("m_scored")}</dt><dd>${num(D.model.n_scored)} · ${t("m_unscored")}: ${num(D.model.n_insufficient_history)}</dd></div>
          <div><dt>${t("m_auc")} · ${t("m_brier")} · ${t("m_ece")}</dt><dd class="mono">${D.model.auc} · ${D.model.brier} · ${D.model.ece}</dd></div>
        </dl>
        <h4>${t("m_cal")}</h4><div class="calwrap">${calChart(D.model.calibration)}</div>
        <h4>${t("m_drivers")}</h4>
        <ul class="drivers">${coefs.map((c) => `<li><span>${esc(driverText(c.label, state.lang))}</span><span class="dbar"><i class="${c.coef > 0 ? "up" : "down"}" style="width:${(Math.abs(c.coef) / cmax) * 100}%"></i></span><span class="small muted">${c.coef > 0 ? t("m_raises") : t("m_lowers")}</span></li>`).join("")}</ul>
      </section>
      <section class="card wide"><h3>${t("s_title")}</h3><p class="muted small">${t("s_sub", { k: D.meta.min_cell })}</p>
        <div class="tscroll"><table><thead><tr><th>${t("s_seg")}</th><th class="n">${t("s_n")}</th><th class="n">${t("s_rec")}</th><th class="n">${t("s_uptake")}</th><th class="n">${t("s_gap")}</th><th>${t("s_flag")}</th></tr></thead>
        <tbody>${segs.map((s) => `<tr><td>${esc(segText(s.segment, state.lang))}: <b>${esc(segText(s.group, state.lang))}</b></td>
          ${s.suppressed ? `<td class="n" colspan="4">${t("s_supp")}</td>` : `<td class="n">${num(s.n)}</td><td class="n">${num(s.recommended_pct)}%</td><td class="n">${num(s.baseline_uptake_pct)}%</td><td class="n">${s.calibration_gap_pts > 0 ? "+" : ""}${num(s.calibration_gap_pts)}</td>`}
          <td>${s.needs_local_recalibration ? `<span class="badge t2">${ICON[2]}${t("s_recal")}</span>` : `<span class="badge ok">${ICON.ok}${t("s_ok")}</span>`}</td></tr>`).join("")}</tbody></table></div>

        <div class="tscroll"><table><thead><tr><th>${t("q_who")}</th><th>${t("q_gaps")}</th><th class="n">${t("q_risk")}</th><th>${t("q_why")}</th><th>${t("q_how")}</th><th></th></tr></thead>
        <tbody>${q.map((r) => `<tr><td><span class="mono">${r.pseudonym}</span><br><span class="badge t${r.tier}">${ICON[r.tier]}${t(`tier.${r.tier}`)}</span></td>
          <td>${r.gaps.map((g) => esc(pkgShort(g, state.lang))).join(", ")}</td>
          <td class="n">${r.insufficient_history ? t("q_nohist") : `${num(r.predicted_noncompletion_pct)}%`}</td>
          <td class="small">${r.drivers.map((d) => esc(driverText(d.label, state.lang))).join(" · ")}</td>
          <td>${t(`channel.${r.suggested_channel}`)} · ${t(`language.${r.suggested_language}`)}${r.interpreter_needed ? `<br><span class="badge neutral">${ICON.info}${t("q_interp")}</span>` : ""}</td>
          <td><button class="btn small" data-act="openrec" data-p="${r.pseudonym}">${t("q_open")}</button></td></tr>`).join("")}</tbody></table></div>
      </section>
      <section class="card wide">${logPanel("program", (e) => e.actor === "actor_adphc", t("prog_log"))}</section>
      <section class="card wide"><h3>${t("assumptions")}</h3><ul class="assume">${D.assumptions.map((s) => `<li>${esc(s)}</li>`).join("")}${RULES.meta.assumptions.map((s) => `<li>${esc(s)}</li>`).join("")}</ul></section>
    </div>
  </div>`;
}

// ---------------------------------------------------------------- modal, toast

function modal() {
  const m = state.modal;
  if (!m) return "";
  let body = "";
  if (m.type === "book") {
    const hh = household();
    const slots = [[2, "09:30"], [3, "16:00"], [6, "10:15"]].map(([d, h]) => `${addDays(REF, d)}T${h}:00Z`);
    body = `<h3 id="mt">${t("book_title", { title: esc(itemTitle(m.item, state.lang)) })}</h3>
      <p class="muted">${t("book_for", { name: esc(nm(m.item.personName)) })} · ${t("book_where", { insurance: t(`insurance.${hh.insurance}`) })}</p>
      <p><b>${t("book_pick")}</b></p>
      <div class="slots">${slots.map((s, i) => `<label class="slot"><input type="radio" name="slot" value="${s}" ${i === 0 ? "checked" : ""}><span>${fmtSlot(s)}</span></label>`).join("")}</div>
      <div class="acts end"><button class="btn" data-act="close">${t("cancel")}</button><button class="btn primary" data-act="confirm-book">${t("book_confirm")}</button></div>`;
  } else if (m.type === "snooze") {
    const canDecline = m.item.program === "IFHAS" && m.item.decision === "population";
    body = `<h3 id="mt">${t("snooze_title")}: ${esc(itemTitle(m.item, state.lang))}</h3>
      <div class="opts"><button class="btn block" data-act="confirm-snooze">${t("snooze_30")}</button>
      ${canDecline ? `<button class="btn block" data-act="confirm-decline">${t("snooze_decline")}</button><p class="muted small">${t("decline_note")}</p>` : ""}</div>
      <div class="acts end"><button class="btn" data-act="close">${t("cancel")}</button></div>`;
  } else if (m.type === "openrec") {
    body = `<h3 id="mt">${t("open_title", { p: m.p })}</h3>
      <p><b>${t("open_purpose")}</b></p>
      <div class="slots">${["purpose_outreach", "purpose_followup", "purpose_quality"].map((k, i) => `<label class="slot"><input type="radio" name="purpose" value="${k}" ${i === 0 ? "checked" : ""}><span>${t(k)}</span></label>`).join("")}</div>
      <div class="acts end"><button class="btn" data-act="close">${t("cancel")}</button><button class="btn primary" data-act="confirm-open">${t("open_confirm")}</button></div>`;
  }
  return `<div class="scrim" data-act="close"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">${body}</div>`;
}

// ---------------------------------------------------------------- render + events

const root = document.getElementById("app");
let tipEl;

function render() {
  document.documentElement.lang = state.lang;
  document.documentElement.dir = t("dir");
  const main = state.view === "family" ? familyView() : state.view === "program" ? programView() : howView();
  root.innerHTML = `${header()}<main>${main}</main><footer class="foot">${t("footer")}</footer>${modal()}${state.toast ? `<div class="toast" role="status">${esc(state.toast)}</div>` : ""}<div class="tip" hidden></div>`;
  tipEl = root.querySelector(".tip");
  const first = root.querySelector(".modal input, .modal button.primary");
  if (first) first.focus();
}

function toast(msg) {
  state.toast = msg;
  render();
  clearTimeout(toast.h);
  toast.h = setTimeout(() => { state.toast = null; render(); }, 4200);
}

function findItem(id) {
  const res = evaluateHousehold(household(), RULES, REF);
  const it = res.actions.find((i) => i.id === id);
  return it;
}

root.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.tagName === "SELECT" || el.tagName === "INPUT") return;
  const act = el.dataset.act;
  const hh = household();
  if (act === "lang") state.lang = state.lang === "en" ? "ar" : "en";
  else if (act === "view") { state.view = el.dataset.v; window.scrollTo(0, 0); }
  else if (act === "tab") state.tab = el.dataset.v;
  else if (act === "more") state.showAll = !state.showAll;
  else if (act === "why") state.open[el.dataset.id] = !state.open[el.dataset.id];
  else if (act === "member") { state.tab = "passport"; render(); document.getElementById("m-" + el.dataset.id)?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  else if (act === "book") state.modal = { type: "book", item: findItem(el.dataset.id) };
  else if (act === "snooze") state.modal = { type: "snooze", item: findItem(el.dataset.id) };
  else if (act === "openrec") state.modal = { type: "openrec", p: el.dataset.p };
  else if (act === "close") state.modal = null;
  else if (act === "confirm-book") {
    const it = state.modal.item;
    const slot = root.querySelector('input[name="slot"]:checked').value;
    state.booked[it.id] = slot;
    state.modal = null;
    await log({ hh: hh.id, subject: it.personId, actor: `person:${manager(hh).id}`, action: "booking", purpose: "purpose_booking", data: ["demographics"], key: it.key });
    return toast(t("booked", { slot: fmtSlot(slot) }));
  } else if (act === "confirm-snooze") {
    const it = state.modal.item;
    state.snoozed[it.id] = addDays(REF, 30);
    state.modal = null;
    await log({ hh: hh.id, subject: it.personId, actor: `person:${manager(hh).id}`, action: "snoozed", purpose: "purpose_consent", data: [], key: it.key });
    return toast(t("snoozed", { date: fmtDate(state.snoozed[it.id]) }));
  } else if (act === "confirm-decline") {
    const it = state.modal.item;
    const p = hh.members.find((m) => m.id === it.personId);
    p.screening = p.screening || {};
    p.screening[it.key] = { ...(p.screening[it.key] || {}), declined_on: REF };
    state.modal = null;
    await log({ hh: hh.id, subject: it.personId, actor: `person:${it.personId}`, action: "declined", purpose: "purpose_consent", data: ["screening_history"], key: it.key });
    return toast(t("decline_note"));
  } else if (act === "confirm-open") {
    const purpose = root.querySelector('input[name="purpose"]:checked').value;
    const p = state.modal.p;
    state.modal = null;
    const i = await log({ hh: "POP", subject: p, actor: "actor_adphc", action: "pseud_open", purpose, data: ["demographics", "screening_history"] });
    return toast(t("opened", { i }));
  } else if (act === "verify") {
    const scope = el.dataset.scope;
    state.verify[scope] = { running: true };
    render();
    const filter = scope === "program" ? (e) => e.actor === "actor_adphc" : (e) => e.hh === scope;
    state.verify[scope] = await ledger.verify(filter);
  } else if (act === "tamper") {
    const scope = el.dataset.scope;
    const pool = ledger.entries.filter(scope === "program" ? (e) => e.actor === "actor_adphc" : (e) => e.hh === scope);
    const target = pool[0];
    state.tampered = { index: target.i, original: target };
    // A changed purpose: the kind of quiet edit an audit log must catch.
    ledger.entries[target.i] = { ...target, purpose: target.purpose === "purpose_quality" ? "purpose_outreach" : "purpose_quality" };
    state.verify = {};
  } else if (act === "restore") {
    ledger.entries[state.tampered.index] = state.tampered.original;
    state.tampered = null;
    state.verify = {};
  }
  render();
});

root.addEventListener("change", async (ev) => {
  const el = ev.target;
  if (el.dataset.act === "family") { state.famId = el.value; state.showAll = false; state.open = {}; state.tab = "steps"; render(); return; }
  if (el.dataset.act === "consent") {
    const hh = household();
    const p = hh.members.find((m) => m.id === el.dataset.id);
    p.consent = { ...p.consent, [el.dataset.k]: el.checked };
    await log({ hh: hh.id, subject: p.id, actor: `person:${p.id}`, action: "consent", purpose: "purpose_consent", consent: el.dataset.k, value: el.checked, data: [] });
    toast(state.lang === "ar" ? "تم تحديث الخطوات التالية وتسجيل التغيير." : "Next steps updated and the change logged.");
  }
});

root.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && state.modal) { state.modal = null; render(); }
});

root.addEventListener("pointermove", (ev) => {
  const g = ev.target.closest?.(".hov");
  if (!tipEl) return;
  if (!g) { tipEl.hidden = true; return; }
  tipEl.textContent = g.dataset.tip;
  tipEl.hidden = false;
  const x = Math.min(ev.clientX + 14, window.innerWidth - tipEl.offsetWidth - 8);
  tipEl.style.left = x + "px";
  tipEl.style.top = ev.clientY + 16 + "px";
});

seedLedger().then(render);
root.innerHTML = '<p style="padding:24px">Loading…</p>';

return {  };
})();
</script>
